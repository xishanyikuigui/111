services:
  - type: web
    name: amzws-sqp-report-service
    runtime: python
    rootDir: report_service
    buildCommand: >-
      pip install -r requirements.txt &&
      mkdir -p skill/assets &&
      curl -L --fail https://cdn.jsdelivr.net/npm/echarts@5.6.0/dist/echarts.min.js -o skill/assets/echarts.min.js
    startCommand: gunicorn --workers 2 --timeout 180 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: ALLOWED_ORIGIN
        value: https://xishanyikuigui.github.io
      - key: MAX_UPLOAD_MB
        value: 80
